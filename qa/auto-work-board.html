<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>自动工作中央看板预览</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202632;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.shell{display:grid;grid-template-columns:220px 1fr;height:100vh;overflow:hidden}aside{padding:22px 14px;background:#fff;border-right:1px solid #e5e8ee}aside h2{margin:0 0 24px;font-size:16px}.nav{display:flex;align-items:center;gap:8px;margin:4px 0;padding:9px 11px;border-radius:7px;color:#687386;font-size:13px}.nav.active{color:#202632;background:#eef2ff}.main{position:relative;min-width:0;background:#fff}.conversation{display:flex;height:100%;align-items:center;justify-content:center;color:#9aa3b2;font-size:13px}.board{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}.header{display:flex;align-items:center;gap:12px;min-height:68px;padding:0 28px;border-bottom:1px solid #e5e8ee}.header h1{margin:0;font-size:20px}.hint{color:#8d96a5;font-size:12px}.spacer{flex:1}.search{width:210px;padding:8px 10px;border:1px solid #e0e4ea;border-radius:7px}.btn{padding:8px 12px;border:1px solid #dfe4eb;border-radius:7px;background:#fff;color:#566174;font-size:12px}.primary{border-color:#4b72ff;background:#4b72ff;color:#fff}.tabs{display:flex;gap:3px;padding:0 28px;border-bottom:1px solid #f0f1f4}.tab{padding:12px;border:0;border-bottom:2px solid transparent;background:transparent;color:#8a93a1;font-size:12px}.tab.active{border-bottom-color:#4b72ff;color:#202632;font-weight:600}.count{margin-left:5px;padding:3px 6px;border-radius:9px;background:#f0f2f5;font-size:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start;overflow:auto;padding:20px 28px}.card{display:flex;min-height:142px;flex-direction:column;gap:10px;padding:15px;border:1px solid #e1e5eb;border-radius:10px;background:#fff;box-shadow:0 1px 2px #14203a08}.status{color:#596273;font-size:11px}.dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#9aa1ae}.running .dot{background:#4b72ff}.done .dot{background:#2ea66f}.title{font-size:14px;font-weight:650}.prompt{color:#667080;font-size:12px;line-height:1.45}.meta{display:flex;gap:8px;margin-top:auto;color:#9098a6;font-size:11px}
  </style>
</head>
<body>
  <div class="shell">
    <aside><h2>DSH Workspace</h2><div class="nav">新会话</div><div class="nav">会话列表</div><div class="nav active">◷　自动工作</div><div class="nav">设置</div></aside>
    <main class="main"><div class="conversation">会话中栏由自动工作看板接管</div><section class="board"><header class="header"><h1>自动工作</h1><span class="hint">按当前账号管理定时 Agent 工作</span><span class="spacer"></span><input class="search" placeholder="搜索任务"><button class="btn primary">新建任务</button><button class="btn">←</button></header><nav class="tabs"><button class="tab active">全部 <b class="count">4</b></button><button class="tab">待机 <b class="count">2</b></button><button class="tab">运行中 <b class="count">1</b></button><button class="tab">成功 <b class="count">1</b></button><button class="tab">失败 <b class="count">0</b></button><button class="tab">已归档 <b class="count">0</b></button></nav><div class="grid"><article class="card"><div class="status running"><span class="dot"></span>运行中</div><div class="title">整理项目进展</div><div class="prompt">检查当前项目的待办事项，整理成简洁的工作摘要。</div><div class="meta"><span>下次 +42 分钟</span><span>会话 · own-session</span><span>3 次执行</span></div></article><article class="card"><div class="status done"><span class="dot"></span>成功</div><div class="title">每日测试报告</div><div class="prompt">运行项目测试并汇总失败项，保留关键信息。</div><div class="meta"><span>下次明天 08:30</span><span>工作空间 · own-workspace</span><span>12 次执行</span></div></article><article class="card"><div class="status"><span class="dot"></span>待机</div><div class="title">同步工作日志</div><div class="prompt">检查变更并更新当天的工作记录。</div><div class="meta"><span>下次每 2 小时</span><span>默认工作空间</span><span>0 次执行</span></div></article></div></section></main>
  </div>
</body>
</html>
